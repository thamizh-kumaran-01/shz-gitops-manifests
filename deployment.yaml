apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-app
  labels:
    app: my-zero-trust-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-zero-trust-app
  template:
    metadata:
      labels:
        app: my-zero-trust-app
    spec:
      containers:
      - name: dummy-container
        image: nginx:latest
        ports:
        - containerPort: 80
