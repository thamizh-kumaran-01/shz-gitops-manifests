apiVersion: apps/v1
kind: Deployment
metadata:
  name: shz-deployment
  namespace: default
  labels:
    app: shz-v1
    owner: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shz-v1
  template:
    metadata:
      labels:
        app: shz-v1
    spec:
      containers:
      - name: web-app
        image: ghcr.io/thamizh-kumaran-01/shz-app@sha256:5195927994c7e88d980f46bd5ec7882db380a33585254d76388c644953776c6d
        ports:
        - containerPort: 80
