apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shz-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thamizh-kumaran-01/shz-gitops-manifests.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
