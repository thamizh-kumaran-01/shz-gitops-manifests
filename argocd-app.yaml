apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shz-deployment
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/thamizh-kumaran-01/shz-gitops-manifests.git'
    targetRevision: HEAD
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
